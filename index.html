<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>简易空当接龙</title>
    <style>
        body { background-color: #277714; color: white; font-family: sans-serif; margin: 0; padding: 0; user-select: none; }
        #game-area { display: flex; flex-direction: column; height: 100vh; padding: 5px; box-sizing: border-box; }
        .top-section { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .freecell-area, .foundation-area { display: flex; gap: 5px; }
        .card-slot { width: 13vw; height: 18vw; border: 2px dashed rgba(255,255,255,0.3); border-radius: 5px; position: relative; max-width: 70px; max-height: 100px; }
        .tableau-area { display: flex; justify-content: space-between; flex-grow: 1; gap: 2px; }
        .column { flex: 1; position: relative; min-height: 200px; }
        
        /* 卡片样式 */
        .card { 
            width: 13vw; height: 18vw; max-width: 70px; max-height: 100px;
            background: white; border-radius: 4px; color: black;
            position: absolute; box-shadow: 1px 1px 3px rgba(0,0,0,0.5);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            font-size: 4vw; font-weight: bold; cursor: pointer; border: 1px solid #999;
        }
        .card.red { color: #d40000; }
        .card.selected { border: 3px solid yellow; transform: translateY(-5px); z-index: 100 !important; }
        .card-back { background: repeating-linear-gradient(45deg, #606dbc, #606dbc 10px, #465298 10px, #465298 20px); }
        
        /* 布局调整 */
        .column .card { position: relative; margin-top: -14vw; } /* 卡片堆叠间距 */
        .column .card:first-child { margin-top: 0; }
        
        #message { position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.8); padding: 20px; border-radius: 10px; display: none; text-align: center; z-index: 999; }
        button { padding: 10px 20px; font-size: 16px; background: #ffcc00; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px;}
    </style>
</head>
<body>

<div id="game-area">
    <!-- 顶部：自由单元格 和 终点区 -->
    <div class="top-section">
        <div class="freecell-area" id="freecells">
            <!-- 4个空位 -->
            <div class="card-slot" data-type="free" onclick="clickSlot(this)"></div>
            <div class="card-slot" data-type="free" onclick="clickSlot(this)"></div>
            <div class="card-slot" data-type="free" onclick="clickSlot(this)"></div>
            <div class="card-slot" data-type="free" onclick="clickSlot(this)"></div>
        </div>
        <div class="foundation-area" id="foundations">
            <!-- 4个花色终点 -->
            <div class="card-slot" data-suit="H" data-type="found" onclick="clickSlot(this)"></div>
            <div class="card-slot" data-suit="D" data-type="found" onclick="clickSlot(this)"></div>
            <div class="card-slot" data-suit="C" data-type="found" onclick="clickSlot(this)"></div>
            <div class="card-slot" data-suit="S" data-type="found" onclick="clickSlot(this)"></div>
        </div>
    </div>

    <!-- 下方：8列牌 -->
    <div class="tableau-area" id="tableau">
        <!-- JS会自动生成8列 -->
    </div>
</div>

<div id="message">
    <h2 id="msg-text">恭喜胜利！</h2>
    <button onclick="initGame()">再来一局</button>
</div>

<script>
// --- 游戏核心逻辑开始 ---
const SUITS = ['H', 'D', 'C', 'S']; // 红桃, 方块, 梅花, 黑桃
const SYMBOLS = {'H': '♥', 'D': '♦', 'C': '♣', 'S': '♠'};
let deck = [];
let selectedCard = null; // 当前选中的牌
let columns = [[], [], [], [], [], [], [], []]; // 8列数据

function initGame() {
    document.getElementById('message').style.display = 'none';
    // 生成52张牌
    deck = [];
    for(let s of SUITS) {
        for(let r=1; r<=13; r++) {
            deck.push({suit: s, rank: r, id: s+r});
        }
    }
    // 洗牌
    deck.sort(() => Math.random() - 0.5);
    
    // 重置区域
    columns = [[], [], [], [], [], [], [], []];
    document.querySelectorAll('.card-slot').forEach(el => el.innerHTML = '');
    document.getElementById('tableau').innerHTML = '';
    
    // 创建8列DOM
    for(let i=0; i<8; i++) {
        let colDiv = document.createElement('div');
        colDiv.className = 'column';
        colDiv.id = 'col-'+i;
        colDiv.onclick = (e) => clickColumn(i, e);
        document.getElementById('tableau').appendChild(colDiv);
    }

    // 发牌 (前4列7张，后4列6张)
    let idx = 0;
    for(let r=0; r<7; r++) {
        for(let c=0; c<8; c++) {
            if (r === 6 && c >= 4) break; // 后4列只有6张
            if (idx < deck.length) {
                addCardToColumn(c, deck[idx]);
                idx++;
            }
        }
    }
    selectedCard = null;
}

function createCardEl(cardData) {
    let el = document.createElement('div');
    el.className = 'card ' + (cardData.suit === 'H' || cardData.suit === 'D' ? 'red' : '');
    el.innerHTML = `<span>${SYMBOLS[cardData.suit]}</span><span>${getRankStr(cardData.rank)}</span>`;
    el.dataset.suit = cardData.suit;
    el.dataset.rank = cardData.rank;
    el.dataset.id = cardData.id;
    return el;
}

function getRankStr(r) {
    if(r===1) return 'A';
    if(r===11) return 'J';
    if(r===12) return 'Q';
    if(r===13) return 'K';
    return r;
}

function addCardToColumn(colIndex, cardData) {
    columns[colIndex].push(cardData);
    renderColumn(colIndex);
}

function renderColumn(colIndex) {
    let colDiv = document.getElementById('col-'+colIndex);
    colDiv.innerHTML = '';
    columns[colIndex].forEach(card => {
        let el = createCardEl(card);
        if(selectedCard && selectedCard.id === card.id) el.classList.add('selected');
        colDiv.appendChild(el);
    });
}

// 点击列（处理选中和移动）
function clickColumn(colIndex, e) {
    if(e.target.classList.contains('card')) return; // 点击具体卡牌由卡牌事件处理
    
    let colData = columns[colIndex];
    if(colData.length === 0) {
        if(selectedCard) moveCardToCol(colIndex);
    } else {
        // 点击了该列最后一张牌
        let lastCard = colData[colData.length - 1];
        handleCardClick(lastCard, 'col', colIndex);
    }
}

// 点击卡牌（绑定在生成的元素上）
document.addEventListener('click', function(e) {
    if(e.target.closest('.card')) {
        let cardEl = e.target.closest('.card');
        let colDiv = cardEl.parentElement;
        if(colDiv.classList.contains('column')) {
            let colId = parseInt(colDiv.id.split('-')[1]);
            let colData = columns[colId];
            let cardId = cardEl.dataset.id;
            // 找到这张牌的数据
            let cardIdx = colData.findIndex(c => c.id === cardId);
            // 只能选中最下面的一张，或者已经选中的一串（简化版只允许选一张）
            if(cardIdx === colData.length - 1) {
                handleCardClick(colData[cardIdx], 'col', colId);
            }
        }
    }
});
